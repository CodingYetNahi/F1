<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>F1 Horizon Racing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: #000;
            box-shadow: 0 0 30px rgba(0,255,200,0.2);
            overflow: hidden;
            border-radius: 12px;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }

        .hud-value {
            color: #00e5ff;
            font-family: monospace;
            font-size: 16px;
        }

        /* Touch Control Overlay */
        #touchControls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 15;
        }

        .control-group {
            display: flex;
            gap: 15px;
        }

        .btn-touch {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            touch-action: manipulation;
        }

        .btn-touch:active {
            background: rgba(0, 229, 255, 0.5);
            transform: scale(0.95);
        }

        .btn-pedal {
            width: 60px;
            height: 80px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-gas { background: rgba(0, 230, 118, 0.3); border-color: #00e676; }
        .btn-brake { background: rgba(255, 23, 68, 0.3); border-color: #ff1744; }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
        }

        .overlay-screen h1 {
            font-size: 36px;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
            margin-bottom: 10px;
        }

        .btn-action {
            padding: 12px 30px;
            font-size: 18px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255,0,85,0.4);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="ui">
            <div class="hud-card">🏎️ <span id="speed" class="hud-value">0</span> <small>KM/H</small></div>
            <div class="hud-card">🚩 SCORE <span id="score" class="hud-value">0</span></div>
        </div>

        <div id="touchControls">
            <div class="control-group">
                <div class="btn-touch" id="btnLeft">◀</div>
                <div class="btn-touch" id="btnRight">▶</div>
            </div>
            <div class="control-group">
                <div class="btn-touch btn-pedal btn-brake" id="btnBrake">BRAKE</div>
                <div class="btn-touch btn-pedal btn-gas" id="btnGas">GAS</div>
            </div>
        </div>

        <div id="startScreen" class="overlay-screen">
            <h1>F1 HORIZON</h1>
            <p>Infinite Track Challenge</p>
            <button class="btn-action" onclick="startGame()">START RACE</button>
        </div>

        <div id="gameOverScreen" class="overlay-screen hidden">
            <h1>CRASHED!</h1>
            <p style="font-size: 20px;">Final Score: <span id="finalScore" style="color:#00e5ff;">0</span></p>
            <button class="btn-action" onclick="restartGame()">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive Resolution
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // State & Input Controls
        let gameRunning = false;
        let speed = 0;
        let maxSpeed = 15;
        let distance = 0;
        let trackOffset = 0;
        let roadCurve = 0;
        let targetCurve = 0;

        const inputs = { left: false, right: false, gas: false, brake: false };

        // Keyboard Controls
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') inputs.gas = true;
            if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = true;
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') inputs.gas = false;
            if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = false;
        });

        // Touch Button Controls
        function bindTouch(id, key) {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); inputs[key] = true; };
            const end = (e) => { e.preventDefault(); inputs[key] = false; };
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
        }

        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnGas', 'gas');
        bindTouch('btnBrake', 'brake');

        // Fixed Player Car
        const player = {
            x: 0, // Offset from road center (-1 to 1)
            y: 0, // Fixed vertical position calculated in loop
            width: 36,
            height: 60
        };

        // Scenery & Traffic System
        let traffic = [];
        let scenery = [];

        function spawnTraffic() {
            if (Math.random() < 0.02 && traffic.length < 4) {
                traffic.push({
                    x: (Math.random() * 1.4 - 0.7),
                    y: -100,
                    speed: 3 + Math.random() * 4,
                    color: ['#0090ff', '#00e676', '#ffea00', '#d500f9'][Math.floor(Math.random() * 4)]
                });
            }
        }

        function updateGame() {
            // Speed logic
            if (inputs.gas) speed += 0.15;
            else if (inputs.brake) speed -= 0.3;
            else speed *= 0.98;

            speed = Math.max(0, Math.min(speed, maxSpeed));
            distance += speed;

            // Steering Logic
            if (speed > 0.5) {
                if (inputs.left) player.x -= 0.03 * (speed / maxSpeed);
                if (inputs.right) player.x += 0.03 * (speed / maxSpeed);
            }

            // Road Track Curvature Logic
            if (Math.random() < 0.01) {
                targetCurve = (Math.random() - 0.5) * 2;
            }
            roadCurve += (targetCurve - roadCurve) * 0.02;
            player.x -= roadCurve * (speed / maxSpeed) * 0.012; // Drag player around bends

            // Off-Road Slowdown
            if (Math.abs(player.x) > 0.75) {
                speed *= 0.92;
            }

            // Spawn & Move Traffic relative to player fixed perspective
            spawnTraffic();
            const roadWidth = canvas.width * 0.55;
            const roadCenter = canvas.width / 2;

            for (let i = traffic.length - 1; i >= 0; i--) {
                let car = traffic[i];
                car.y += (speed - car.speed); // Moves according to relative speed

                // Collision Detection with Fixed Player
                const playerScreenX = roadCenter + player.x * (roadWidth / 2);
                const playerScreenY = canvas.height - 120;
                const carScreenX = roadCenter + car.x * (roadWidth / 2);

                if (Math.abs(carScreenX - playerScreenX) < 30 && Math.abs(car.y - playerScreenY) < 50) {
                    endGame();
                }

                // Remove out-of-bounds traffic
                if (car.y > canvas.height + 100 || car.y < -200) {
                    traffic.splice(i, 1);
                }
            }
        }

        function drawTrack() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grass
            ctx.fillStyle = '#1b381e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const roadWidth = canvas.width * 0.55;
            const roadLeft = (canvas.width - roadWidth) / 2 + (roadCurve * 15);

            // Red/White Outer Kerbs
            ctx.fillStyle = Math.floor(distance / 20) % 2 === 0 ? '#ff1744' : '#ffffff';
            ctx.fillRect(roadLeft - 12, 0, 12, canvas.height);
            ctx.fillRect(roadLeft + roadWidth, 0, 12, canvas.height);

            // Asphalt Road
            ctx.fillStyle = '#2c2c2c';
            ctx.fillRect(roadLeft, 0, roadWidth, canvas.height);

            // Scrolling Center Lane Stripes
            ctx.fillStyle = '#ffffff';
            const stripeHeight = 30;
            const stripeGap = 20;
            const offset = (distance * 2) % (stripeHeight + stripeGap);

            for (let y = -stripeHeight + offset; y < canvas.height; y += stripeHeight + stripeGap) {
                ctx.fillRect(roadLeft + roadWidth / 2 - 3, y, 6, stripeHeight);
            }

            // Render AI Traffic
            traffic.forEach(car => {
                const carX = roadLeft + (car.x + 0.8) * (roadWidth / 1.6);
                drawCar(carX, car.y, car.color, false);
            });

            // Render FIXED Player Car
            const playerX = roadLeft + (player.x + 0.8) * (roadWidth / 1.6);
            player.y = canvas.height - 120;
            drawCar(playerX, player.y, '#e10600', true);
        }

        function drawCar(x, y, color, isPlayer) {
            ctx.save();
            ctx.translate(x, y);

            // Wheels
            ctx.fillStyle = '#000';
            ctx.fillRect(-18, -22, 6, 12);
            ctx.fillRect(12, -22, 6, 12);
            ctx.fillRect(-18, 12, 6, 12);
            ctx.fillRect(12, 12, 6, 12);

            // Main Body
            ctx.fillStyle = color;
            ctx.fillRect(-12, -20, 24, 40);

            // Cockpit
            ctx.fillStyle = '#111';
            ctx.fillRect(-6, -6, 12, 14);

            // Wings
            ctx.fillStyle = '#222';
            ctx.fillRect(-16, -25, 32, 5); // Front Wing
            ctx.fillRect(-16, 18, 32, 6);  // Rear Wing

            // Player Highlight Effect
            if (isPlayer) {
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-13, -21, 26, 42);
            }

            ctx.restore();
        }

        function gameLoop() {
            if (!gameRunning) return;

            updateGame();
            drawTrack();

            // UI Updates
            document.getElementById('speed').textContent = Math.round(speed * 18);
            document.getElementById('score').textContent = Math.floor(distance / 10);

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            gameRunning = true;
            speed = 0;
            distance = 0;
            player.x = 0;
            traffic = [];
            gameLoop();
        }

        function endGame() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = Math.floor(distance / 10);
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function restartGame() {
            startGame();
        }
    </script>
</body>
</html>
