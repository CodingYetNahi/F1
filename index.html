<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>F1 World Championship</title>
    <style>
        :root {
            --apple-glass: rgba(255, 255, 255, 0.12);
            --apple-glass-border: rgba(255, 255, 255, 0.18);
            --apple-dark-glass: rgba(0, 0, 0, 0.65);
            --apple-red: #ff3b30;
            --apple-blue: #0a84ff;
            --apple-green: #30d158;
            --apple-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--apple-font);
        }

        body {
            background-color: #050507;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            color: #ffffff;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 840px;
            background: #000;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.2);
            overflow: hidden;
            border-radius: 28px;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Top HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .hud-pill {
            background: var(--apple-dark-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--apple-glass-border);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .hud-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.6);
        }

        .hud-val {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .hud-val.highlight {
            color: var(--apple-blue);
        }

        /* Countdown Visual */
        #countdownOverlay {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px rgba(10, 132, 255, 0.8);
            z-index: 12;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        /* Standings Leaderboard */
        #leaderboard {
            position: absolute;
            top: 75px;
            right: 16px;
            width: 110px;
            background: var(--apple-dark-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--apple-glass-border);
            border-radius: 16px;
            padding: 8px 10px;
            z-index: 10;
            pointer-events: none;
        }

        .lb-title {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 4px;
        }

        .lb-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 0;
            color: rgba(255, 255, 255, 0.8);
        }

        .lb-row.player {
            color: var(--apple-blue);
            font-weight: 800;
        }

        /* Touch Controls (Positioned Lower) */
        #touchControls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 15;
        }

        .control-group {
            display: flex;
            gap: 12px;
        }

        .btn-apple {
            width: 60px;
            height: 60px;
            background: var(--apple-glass);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid var(--apple-glass-border);
            border-radius: 50%;
            color: white;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.15s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .btn-apple:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-pedal {
            width: 58px;
            height: 72px;
            border-radius: 18px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-gas {
            background: rgba(48, 209, 88, 0.22);
            border-color: rgba(48, 209, 88, 0.45);
            color: var(--apple-green);
        }

        .btn-brake {
            background: rgba(255, 59, 48, 0.22);
            border-color: rgba(255, 59, 48, 0.45);
            color: var(--apple-red);
        }

        /* Modals & Overlays */
        .apple-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px;
            text-align: center;
            z-index: 20;
            transition: opacity 0.4s ease;
        }

        .apple-card {
            background: var(--apple-dark-glass);
            border: 1px solid var(--apple-glass-border);
            border-radius: 28px;
            padding: 32px 24px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .apple-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1A6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .apple-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
            font-weight: 500;
        }

        .apple-btn {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            border: none;
            background: var(--apple-blue);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.2px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3);
        }

        .apple-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(10, 132, 255, 0.4);
        }

        .apple-btn:active {
            transform: scale(0.98);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 24px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }

        .stat-val {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .stat-lbl {
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            margin-top: 2px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- Top HUD -->
        <div id="hud">
            <div class="hud-pill">
                <div>
                    <div class="hud-label">Circuit</div>
                    <div class="hud-val highlight" id="levelDisplay">1/5</div>
                </div>
            </div>
            <div class="hud-pill">
                <div>
                    <div class="hud-label">Rank</div>
                    <div class="hud-val" id="rankDisplay">6th</div>
                </div>
            </div>
            <div class="hud-pill">
                <div>
                    <div class="hud-label">Distance</div>
                    <div class="hud-val" id="distDisplay">0m</div>
                </div>
            </div>
        </div>

        <div id="countdownOverlay" class="hidden">3</div>

        <!-- Standings -->
        <div id="leaderboard">
            <div class="lb-title">Standings</div>
            <div id="lbRows"></div>
        </div>

        <!-- Touch Controls -->
        <div id="touchControls">
            <div class="control-group">
                <div class="btn-apple" id="btnLeft">‹</div>
                <div class="btn-apple" id="btnRight">›</div>
            </div>
            <div class="control-group">
                <div class="btn-apple btn-pedal btn-brake" id="btnBrake">Brake</div>
                <div class="btn-apple btn-pedal btn-gas" id="btnGas">Drive</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="apple-overlay">
            <div class="apple-card">
                <div class="apple-title">F1 World Championship</div>
                <div class="apple-subtitle" id="trackName">Level 1 — Bahrain GP</div>
                <div class="stat-grid">
                    <div class="stat-box">
                        <div class="stat-val" id="raceDist">800m</div>
                        <div class="stat-lbl">Target</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val">Top 3</div>
                        <div class="stat-lbl">Qualify</div>
                    </div>
                </div>
                <button class="apple-btn" onclick="startGame()">Start Race</button>
            </div>
        </div>

        <!-- Win Screen -->
        <div id="winScreen" class="apple-overlay hidden">
            <div class="apple-card">
                <div class="apple-title" style="color: var(--apple-green);">Qualifying Finish!</div>
                <div class="apple-subtitle" id="winSub">Qualified for Next Circuit</div>
                <div class="stat-grid">
                    <div class="stat-box">
                        <div class="stat-val" id="finalRank" style="color: var(--apple-blue);">1st</div>
                        <div class="stat-lbl">Position</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="finalLevel">2/5</div>
                        <div class="stat-lbl">Next Circuit</div>
                    </div>
                </div>
                <button class="apple-btn" onclick="nextLevel()">Next Race</button>
            </div>
        </div>

        <!-- Lose Screen -->
        <div id="loseScreen" class="apple-overlay hidden">
            <div class="apple-card">
                <div class="apple-title" style="color: var(--apple-red);">Did Not Qualify</div>
                <div class="apple-subtitle">You must finish in the Top 3 to advance</div>
                <button class="apple-btn" style="background: rgba(255,255,255,0.15);" onclick="restartLevel()">Try Again</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Web Audio Synthesizer Engine (Music & SFX)
        let audioCtx = null;
        let isAudioInit = false;
        let musicTimer = null;

        function initAudio() {
            if (isAudioInit) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            isAudioInit = true;
            startAudioLoop();
        }

        function playSoundNote(freq, duration, type = 'sine', gainVal = 0.1) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function startAudioLoop() {
            const notes = [130.81, 146.83, 164.81, 174.61, 196.00, 220.00];
            let step = 0;
            musicTimer = setInterval(() => {
                if (gameRunning && countdownState <= 0) {
                    const freq = notes[step % notes.length];
                    playSoundNote(freq * (speed > 5 ? 1.5 : 1), 0.25, 'sawtooth', 0.03);
                    step++;
                }
            }, 220);
        }

        // Levels Setup (Easier balance)
        const LEVELS = [
            { name: "Bahrain GP", length: 800, targetRank: 3, roadColor: "#2a2a2e", grassColor: "#1c2b1e" },
            { name: "Monaco GP", length: 1100, targetRank: 3, roadColor: "#222225", grassColor: "#152017" },
            { name: "Silverstone GP", length: 1400, targetRank: 3, roadColor: "#2c2d30", grassColor: "#19331d" },
            { name: "Monza GP", length: 1800, targetRank: 2, roadColor: "#28282b", grassColor: "#1b301c" },
            { name: "Yas Marina GP", length: 2200, targetRank: 1, roadColor: "#212124", grassColor: "#132316" }
        ];

        let currentLevelIdx = 0;
        let gameRunning = false;
        let countdownState = 3;
        let speed = 0;
        const maxSpeed = 15;
        let playerProgress = 0;
        let roadCurve = 0;
        let targetCurve = 0;

        const inputs = { left: false, right: false, gas: false, brake: false };

        // Controls
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') inputs.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputs.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') inputs.gas = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') inputs.brake = true;
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') inputs.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputs.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') inputs.gas = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') inputs.brake = false;
        });

        function bindTouch(id, key) {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); initAudio(); inputs[key] = true; };
            const end = (e) => { e.preventDefault(); inputs[key] = false; };
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
        }

        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnGas', 'gas');
        bindTouch('btnBrake', 'brake');

        // Player & AI Setup
        // Positioned car higher (camera height - 230) so controls never cover it
        const player = { x: 0, width: 32, height: 58, color: '#0a84ff', name: 'YOU' };
        let competitors = [];

        function initGrid() {
            const colors = ['#ff3b30', '#30d158', '#ffd60a', '#bf5af2', '#ff9f0a'];
            const names = ['VER', 'HAM', 'LEC', 'NOR', 'ALO'];
            competitors = [];

            // Fair start grid: AI starts aligned/behind
            for (let i = 0; i < 5; i++) {
                competitors.push({
                    id: i,
                    name: names[i],
                    color: colors[i],
                    x: (i % 2 === 0 ? 0.35 : -0.35),
                    progress: -40 - (i * 30), // Grid staggering
                    baseSpeed: 9.8 + Math.random() * 2.2, // Fairer overtake balance
                    laneTarget: (Math.random() * 0.8 - 0.4)
                });
            }
        }

        function runCountdown() {
            const overlay = document.getElementById('countdownOverlay');
            overlay.classList.remove('hidden');
            countdownState = 3;
            overlay.textContent = countdownState;
            playSoundNote(440, 0.2, 'square', 0.1);

            const timer = setInterval(() => {
                countdownState--;
                if (countdownState > 0) {
                    overlay.textContent = countdownState;
                    playSoundNote(440, 0.2, 'square', 0.1);
                } else if (countdownState === 0) {
                    overlay.textContent = "GO!";
                    overlay.style.color = "#30d158";
                    playSoundNote(880, 0.4, 'square', 0.15);
                } else {
                    overlay.classList.add('hidden');
                    overlay.style.color = "#ffffff";
                    clearInterval(timer);
                }
            }, 1000);
        }

        function updateGame() {
            if (countdownState > 0) return; // Freeze control during countdown

            const level = LEVELS[currentLevelIdx];

            // Speed physics
            if (inputs.gas) speed += 0.18;
            else if (inputs.brake) speed -= 0.38;
            else speed *= 0.985;

            speed = Math.max(0, Math.min(speed, maxSpeed));
            playerProgress += speed;

            // Steering
            if (speed > 0.2) {
                if (inputs.left) player.x -= 0.038 * (speed / maxSpeed);
                if (inputs.right) player.x += 0.038 * (speed / maxSpeed);
            }

            // Curve drag
            if (Math.random() < 0.015) {
                targetCurve = (Math.random() - 0.5) * 2.0;
            }
            roadCurve += (targetCurve - roadCurve) * 0.025;
            player.x -= roadCurve * (speed / maxSpeed) * 0.01;

            // Grass penalty
            if (Math.abs(player.x) > 0.7) {
                speed *= 0.93;
            }

            // Competitor AI movement
            competitors.forEach(ai => {
                ai.progress += ai.baseSpeed;
                if (Math.random() < 0.02) ai.laneTarget = (Math.random() * 1.0 - 0.5);
                ai.x += (ai.laneTarget - ai.x) * 0.02;

                // Soft bump physics
                const relativeY = (ai.progress - playerProgress);
                if (Math.abs(relativeY) < 40 && Math.abs(ai.x - player.x) < 0.3) {
                    speed *= 0.85;
                    playSoundNote(120, 0.1, 'sawtooth', 0.2);
                }
            });

            // Finish check
            if (playerProgress >= level.length) {
                gameRunning = false;
                const rank = calculateRank();
                if (rank <= level.targetRank) {
                    showWinScreen(rank);
                } else {
                    showLoseScreen();
                }
            }
        }

        function calculateRank() {
            let rank = 1;
            competitors.forEach(ai => {
                if (ai.progress > playerProgress) rank++;
            });
            return rank;
        }

        // Detailed F1 Vector Graphics
        function drawF1Car(x, y, color, isPlayer = false) {
            ctx.save();
            ctx.translate(x, y);

            // Car Drop Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.beginPath();
            ctx.roundRect(-16, -22, 32, 50, 8);
            ctx.fill();

            // Black Slick Tires
            ctx.fillStyle = '#111113';
            ctx.fillRect(-18, -20, 6, 12); // FL
            ctx.fillRect(12, -20, 6, 12);  // FR
            ctx.fillRect(-19, 10, 7, 14);  // RL
            ctx.fillRect(12, 10, 7, 14);   // RR

            // Body Chassis (Aerodynamic taper)
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(7, -12);
            ctx.lineTo(9, 6);
            ctx.lineTo(11, 16);
            ctx.lineTo(-11, 16);
            ctx.lineTo(-9, 6);
            ctx.lineTo(-7, -12);
            ctx.closePath();
            ctx.fill();

            // Cockpit Surround
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(0, -2, 4, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Driver Helmet
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, -2, 2.8, 0, Math.PI * 2);
            ctx.fill();

            // Carbon Front & Rear Wings
            ctx.fillStyle = '#1c1c1e';
            ctx.fillRect(-15, -25, 30, 4); // Front Wing
            ctx.fillRect(-16, 17, 32, 6);  // Rear Wing

            // Rear Safety Light
            ctx.fillStyle = isPlayer ? '#30d158' : '#ff3b30';
            ctx.fillRect(-2, 22, 4, 2);

            ctx.restore();
        }

        function drawTrack() {
            const level = LEVELS[currentLevelIdx];
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grass
            ctx.fillStyle = level.grassColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Zoomed Out Perspective Parameters
            const roadWidth = canvas.width * 0.52;
            const roadLeft = (canvas.width - roadWidth) / 2 + (roadCurve * 14);

            // Kerbs
            ctx.fillStyle = Math.floor(playerProgress / 20) % 2 === 0 ? '#ff3b30' : '#ffffff';
            ctx.fillRect(roadLeft - 8, 0, 8, canvas.height);
            ctx.fillRect(roadLeft + roadWidth, 0, 8, canvas.height);

            // Asphalt Track
            ctx.fillStyle = level.roadColor;
            ctx.fillRect(roadLeft, 0, roadWidth, canvas.height);

            // Track Center Markings
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            const stripeHeight = 24;
            const stripeGap = 20;
            const offset = playerProgress % (stripeHeight + stripeGap);

            for (let y = -stripeHeight + offset; y < canvas.height; y += stripeHeight + stripeGap) {
                ctx.fillRect(roadLeft + roadWidth / 2 - 2, y, 4, stripeHeight);
            }

            // Starting Grid Markers
            if (playerProgress < 200) {
                const gridY = canvas.height - 210 + playerProgress;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fillRect(roadLeft + 10, gridY, roadWidth - 20, 4);
            }

            // Finish Line
            const remainingDist = level.length - playerProgress;
            if (remainingDist < canvas.height) {
                const finishY = canvas.height - 230 - remainingDist;
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < roadWidth; i += 16) {
                    ctx.fillRect(roadLeft + i, finishY, 8, 8);
                    ctx.fillRect(roadLeft + i + 8, finishY + 8, 8, 8);
                }
            }

            // Competitor Cars
            competitors.forEach(ai => {
                const relY = canvas.height - 230 - (ai.progress - playerProgress);
                if (relY > -80 && relY < canvas.height + 80) {
                    const aiX = roadLeft + (ai.x + 0.8) * (roadWidth / 1.6);
                    drawF1Car(aiX, relY, ai.color, false);
                }
            });

            // Player Car (Fixed at high camera position)
            const playerScreenX = roadLeft + (player.x + 0.8) * (roadWidth / 1.6);
            const playerScreenY = canvas.height - 230; 
            drawF1Car(playerScreenX, playerScreenY, player.color, true);
        }

        function updateUI() {
            const level = LEVELS[currentLevelIdx];
            document.getElementById('levelDisplay').textContent = `${currentLevelIdx + 1}/5`;

            const rank = calculateRank();
            const rankSuffix = ["st", "nd", "rd", "th", "th", "th"][rank - 1];
            document.getElementById('rankDisplay').textContent = `${rank}${rankSuffix}`;

            const remaining = Math.max(0, Math.round(level.length - playerProgress));
            document.getElementById('distDisplay').textContent = `${remaining}m`;

            // Standings Leaderboard
            const standings = [{ name: 'YOU', progress: playerProgress, isPlayer: true }, ...competitors]
                .sort((a, b) => b.progress - a.progress);

            const lbRows = document.getElementById('lbRows');
            lbRows.innerHTML = standings.slice(0, 4).map((car, idx) => `
                <div class="lb-row ${car.isPlayer ? 'player' : ''}">
                    <span>${idx + 1}. ${car.name}</span>
                    <span>${Math.max(0, Math.round(car.progress))}m</span>
                </div>
            `).join('');
        }

        function gameLoop() {
            if (!gameRunning) return;

            updateGame();
            drawTrack();
            updateUI();

            requestAnimationFrame(gameLoop);
        }

        function updateLevelInfo() {
            const level = LEVELS[currentLevelIdx];
            document.getElementById('trackName').textContent = `Level ${currentLevelIdx + 1} — ${level.name}`;
            document.getElementById('raceDist').textContent = `${level.length}m`;
        }

        function startGame() {
            initAudio();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('winScreen').classList.add('hidden');
            document.getElementById('loseScreen').classList.add('hidden');

            playerProgress = 0;
            speed = 0;
            player.x = 0;
            initGrid();

            gameRunning = true;
            runCountdown();
            gameLoop();
        }

        function showWinScreen(rank) {
            playSoundNote(523.25, 0.4, 'sine', 0.2);
            const winSub = currentLevelIdx === 4 ? "World Championship Winner!" : "Qualified for Next Circuit";
            document.getElementById('winSub').textContent = winSub;

            const rankSuffix = ["st", "nd", "rd"][rank - 1];
            document.getElementById('finalRank').textContent = `${rank}${rankSuffix}`;
            document.getElementById('finalLevel').textContent = `${currentLevelIdx + 1}/5`;

            document.getElementById('winScreen').classList.remove('hidden');
        }

        function showLoseScreen() {
            playSoundNote(150, 0.5, 'sawtooth', 0.2);
            document.getElementById('loseScreen').classList.remove('hidden');
        }

        function nextLevel() {
            currentLevelIdx = (currentLevelIdx + 1) % LEVELS.length;
            updateLevelInfo();
            document.getElementById('winScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }

        function restartLevel() {
            updateLevelInfo();
            document.getElementById('loseScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }

        // Init
        updateLevelInfo();
        drawTrack();
    </script>
</body>
</html>
